<h2 id="two-kinds-of-motivation">Two kinds of motivation</h2>
<ul>
<li><strong>Intrinsic:</strong> it comes from <strong>your own</strong> goals and reasons</li>
<li><strong>Extrinsic:</strong> it comes from <strong>outside</strong> you
<ul>
<li>Grades for the sake of grades</li>
<li>Someone else's approval</li>
</ul>
</li>
<li>Both work. <strong>Only one of them is still working in November</strong></li>
</ul>

<h3 id="engage-by-suitable-1">Engage by Suitable</h3>
<h1 id="get-on-it-now">Get on it now</h1>

<p><strong>On your phone:</strong> scan, install, then log in with your <strong>SIUE credentials</strong></p>
<p><strong>On a laptop:</strong> go to <strong>suitable.co</strong>, log in, choose <strong>Engage</strong></p>
<p>Then: <strong>Achievements</strong> &gt; <strong>Engage 101</strong> &gt; <strong>Discover Events</strong> &gt; add one to your<br />
calendar and type its name in the reflection box</p>
<footer>FST 101 · Finding a Place at SIUE · Fall 2026</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="FST 101 · Finding a Place at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="7" style="" data-marpit-pagination-total="11" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="FST 101 · Finding a Place at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--footer:FST 101 · Finding a Place at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="11">
<h3 id="practice">Practice</h3>
<h1 id="scavenger-hunt">Scavenger hunt</h1>
<p><strong>In groups. The rest of class.</strong></p>
<p>Your group takes <strong>three or four areas</strong> from the list. For each one:</p>
<ol>
<li><strong>Where is it</strong>, and how do you get to it</li>
<li><strong>What does it actually do</strong> for a student</li>
<li><strong>When would you use it</strong>, honestly</li>
</ol>
<p>Then <strong>report back to the room</strong>.</p>
<footer>FST 101 · Finding a Place at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="FST 101 · Finding a Place at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--footer:FST 101 · Finding a Place at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="11">
<h3 id="scavenger-hunt-1">Scavenger hunt</h3>
<h1 id="the-ten-areas">The ten areas</h1>
<table>
<thead>
<tr>
<th></th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1</strong> Student Organizations (on Engage)</td>
<td><strong>6</strong> Undergraduate Research</td>
</tr>
<tr>
<td><strong>2</strong> Kimmel Belonging and Engagement Hub</td>
<td><strong>7</strong> Athletics</td>
</tr>
<tr>
<td><strong>3</strong> Student Government</td>

<h3 id="campus-logistics">Campus logistics</h3>
<h1 id="printing-before-you-need-it">Printing, before you need it</h1>
<p><strong>Nothing in FST 101 asks you to print anything.</strong> Your other courses will.</p>
<ul>
<li><strong><code>webprint.siue.edu</code></strong>, on eduroam, log in with your <strong>e-ID</strong>. Upload, pick one or two sided</li>
<li>Or <strong>email the file</strong> to <code>BWOneSide@siue.edu</code> or <code>BWTwoSide@siue.edu</code> from your SIUE address</li>
<li><strong>Release it</strong> at a student printer: swipe your <strong>Cougar Card</strong>, pick the job, print</li>
<li><strong>Closest to this room: Peck Hall, 3rd floor lobby</strong></li>
<li><strong>10 cents</strong> a sheet, <strong>15</strong> double sided, <strong>50</strong> colour. <strong>There is no free allowance</strong></li>
<li>Add money in <strong>MySIUE</strong>, or at the Service Center, <strong>Rendleman 1309</strong></li>
</ul>
<footer>FST 101 · Finding a Place at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="FST 101 · Finding a Place at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--footer:FST 101 · Finding a Place at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="11">
<h3 id="before-next-time">Before next time</h3>
<h1 id="wrap">Wrap</h1>
<ul>
<li><strong>Due 9/7 (Tue) or 9/9 (Thu):</strong> <strong>Portfolio Week 2</strong>, your <strong>Engage / Scavenger Hunt Findings</strong></li>
<li><strong>Keep your Five Whys page.</strong> The final version is due <strong>9/14 (Tue) or 9/16 (Thu)</strong></li>
<li><strong>Also by 9/7 (Tue) or 9/9 (Thu)</strong>, for next week: <em>College Success Concise</em> <strong>Ch 3, Reading and Note-Taking</strong>, the reading and note-taking guide, and the three short videos</li>
<li><strong>Go to one thing.</strong> The one you found today, dud or not</li>
<li><strong>Next week, bring a laptop if you have one.</strong> A phone works too</li>
<li><em>Optional, never graded:</em> the <strong>Week 2 setup</strong> at <code>aura-lab.siue.edu/students</code>: Thunderbird, GitHub Copilot</li>
</ul>
<footer>FST 101 · Finding a Place at SIUE · Fall 2026</footer>
