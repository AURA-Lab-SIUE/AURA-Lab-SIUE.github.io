<h3 id="the-reframe">The reframe</h3>
<h1 id="what-a-place-does">What a Place Does</h1>
<p><strong>Not a feeling you arrive with. A thing a room either does or does not do to you.</strong></p>
<ul>
<li>It <strong>uses your name</strong>, and uses it again next week</li>
<li>It <strong>has a chair for you</strong>, without you having to ask</li>
<li>It <strong>tells you what happens next</strong>, instead of assuming you know</li>
</ul>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>

<h3 id="the-reframe-1">The reframe</h3>
<h1 id="what-a-place-does-cont">What a Place Does (cont.)</h1>
<p><strong>Think of one space at SIUE where you belonged, and one where you did not.<br />
What did the SPACE do differently?</strong> Not what you felt. What it did.</p>
<p><strong>Write it down first. Then tell one person.</strong> Nothing gets read out.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="the-words-this-campus-uses">The words this campus uses</h3>
<h1 id="shared-language">Shared Language</h1>
<ul>
<li><strong>Belonging.</strong> &quot;An innate human need to belong to something larger than ourselves. As an action, belonging welcomes, supports, respects, and allows people to bring all of who they are to the space.&quot; (Kimmel Hub, n.d.)</li>
<li><strong>Inclusion.</strong> &quot;Empowering and positively promoting everyone's talents, integrity, and dignity.&quot; (Kimmel Hub, n.d.)</li>
</ul>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="two-that-get-used-interchangeably">Two that get used interchangeably</h3>
<h1 id="equality-and-equity">Equality and Equity</h1>
<ul>
<li><strong>Equality.</strong> &quot;Everyone gets the same thing and number of things. Fairness = sameness. Assumes no differences in starting points or obstacles to the same end goals.&quot; (Kimmel Hub, n.d.)</li>
<li><strong>Equity.</strong> &quot;Everyone gets what they need. Fairness = responsiveness. Achieving equity requires ensuring that those most impacted by a system of injustice are the face of the solution.&quot; (Kimmel Hub, n.d.)</li>
</ul>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="what-the-research-actually-found">What the research actually found</h3>
<h1 id="the-doubt-is-common">The Doubt Is Common</h1>
<ul>
<li>Almost every first-year student wonders whether they belong here. <strong>Almost none of them say so out loud</strong></li>
<li>So each one concludes the doubt is <strong>evidence about them personally</strong>, rather than a normal week five (Walton &amp; Cohen, 2011)</li>
</ul>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="what-the-research-actually-found-1">What the research actually found</h3>
<h1 id="the-doubt-is-common-cont">The Doubt Is Common (cont.)</h1>
<ul>
<li>A bad grade, an awkward meal, an unanswered text: <strong>the same event reads differently</strong> depending on whether you already suspect you do not belong</li>
<li>The finding that matters: <strong>the doubt usually fades</strong>, and knowing that other people have it is part of why (Walton et al., 2023)</li>
</ul>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="from-the-reading">From the reading</h3>
<h1 id="connecting-with-peers">Connecting With Peers</h1>
<ul>
<li><em>Connections Are Everything</em>, <strong>Chapter 4</strong>, was your reading this week (Felten et al., 2023)</li>
<li>One question only: <strong>what did it say that you have already seen happen here?</strong></li>
</ul>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="eight-dimensions">Eight dimensions</h3>
<h1 id="the-wellness-wheel">The Wellness Wheel</h1>
<ul>
<li><strong>Emotional</strong> · <strong>Occupational</strong> · <strong>Intellectual</strong> · <strong>Environmental</strong></li>
<li><strong>Financial</strong> · <strong>Social</strong> · <strong>Physical</strong> · <strong>Spiritual</strong></li>
</ul>
<p>From the <em>Wellness Wheel</em> handout in this week's Learning Resources.</p>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="belonging-is-a-thing-you-schedule">Belonging is a thing you schedule</h3>
<h1 id="two-contacts-the-thing">Two contacts: the thing</h1>
<ol>
<li>Open the <strong>Suitable</strong> app, sign in with your SIUE login, pick <strong>Engage</strong>. No app yet? <code>siue.edu/calendar</code> works in a browser</li>
<li>Find <strong>one</strong> event or organisation in the next two weeks you would actually turn up to</li>
<li>Check it has a <strong>date, a time and a place</strong>, then put it in your phone calendar with the location in it</li>
</ol>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="belonging-is-a-thing-you-schedule-1">Belonging is a thing you schedule</h3>
<h1 id="two-contacts-the-person">Two contacts: the person</h1>
<ol start="4">
<li>Open any <strong>syllabus</strong>. Find that instructor's <strong>office hours</strong></li>
<li>Add <strong>one</strong> office-hours visit to the same calendar, with the room</li>
<li>Set <strong>both</strong> to remind you the day before</li>
</ol>
<p><strong>You leave with: Two calendar entries. One thing, one person. Each with a room and a time.</strong></p>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="one-at-a-time">One at a time</h3>
<h1 id="check-each-others">Check Each Other's</h1>
<p><strong>Keep your own phone. Your partner asks, you answer.</strong></p>
<ol>
<li>What is the <strong>place</strong>?</li>
<li>What is the <strong>day and the time</strong>?</li>
<li>Is a <strong>reminder</strong> set?</li>
</ol>
<p><strong>Three answers or it does not count. Fix it now, while I am still here.</strong></p>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="everything-else-away">Everything else away</h3>
<h1 id="open-excalidraw">Open Excalidraw</h1>
<p><strong><code>excalidraw.com</code></strong>. No sign-in. Laptop or phone.</p>
<ol>
<li><strong>Click anywhere and type.</strong> Again, somewhere else. Keep going</li>
<li><strong>Arrow tool</strong> to connect things that belong together</li>
<li><strong>Pinch or scroll out</strong> so you can see the whole thing at once</li>
<li>When you are done: <strong>Export image</strong>, then <strong>PNG</strong></li>
</ol>
<p><strong>Paper is on the front table if you would rather draw it by hand.</strong></p>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="practice">Practice</h3>
<h1 id="the-wandering-map">The Wandering Map</h1>
<ol>
<li><strong>Name in the middle</strong> of the sheet or the canvas</li>
<li><strong>Think first, write nothing. This part is silent.</strong> Jobs, summers, things you are proud of, hobbies, a person who changed something</li>
<li><strong>Then write fast.</strong> Short phrases, anywhere on the page, no erasing, no spelling</li>
</ol>
<p>Adapted from Brooks, K. (2009). <em>You Majored in What? Mapping Your Path from Chaos to Career.</em> Penguin.</p>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="practice-1">Practice</h3>
<h1 id="the-wandering-map-cont">The Wandering Map (cont.)</h1>
<ul>
<li>Step back. <strong>Which of these belong together?</strong></li>
<li>Write the <strong>themes</strong> down, then <strong>draw lines</strong> connecting experiences to themes</li>
<li>Look for the thread that follows you</li>
</ul>
<p><small>Example themes: heroes and mentors · past jobs · places you have lived · classes you enjoy · hobbies · risky and safe · indoors and outdoors · problem-solving</small></p>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="to-somebody-who-starts-next-year">To somebody who starts next year</h3>
<h1 id="write-it-forward">Write It Forward</h1>
<p><strong>One paragraph, to a student starting FST 101 next year.</strong></p>
<ul>
<li>What did you worry about in the first few weeks?</li>
<li>What turned out to be <strong>normal</strong> rather than a sign about you?</li>
<li>What is <strong>one specific thing</strong> you would tell them to do?</li>
</ul>
<p><strong>Silent. Nobody reads these out. I am not collecting them.</strong></p>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="before-you-go">Before you go</h3>
<h1 id="write-it-as-an-if-then">Write it as an if-then</h1>
<blockquote>
<p>If it is __________ at __________ and I am __________, then I will __________.</p>
</blockquote>
<p><strong>Worked example.</strong> If it is Thursday at 4 and my classes are done for the day, then I will walk to MUC 2027 for the Kimmel Hub open hour.</p>
<p>A plan with a day and a time is a plan. Without one it is a resolution.</p>
<p><strong>Goes in:</strong> Weekly Objectives Week 5.</p>
<p><strong>Also write down:</strong> Which dimension of wellness, and the one specific thing you will do about it in the next two weeks.</p>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="FST 101 · Belonging at SIUE · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--footer:FST 101 · Belonging at SIUE · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="before-next-time">Before next time</h3>
<h1 id="wrap">Wrap</h1>
<ul>
<li><strong>Upload:</strong> your map to <strong>FST Portfolio Week 5</strong>. A photo if it is on paper, the exported PNG if it is not</li>
<li><strong>Submit:</strong> Weekly Objectives Week 5</li>
<li><strong>Read:</strong> <em>Connections Are Everything</em> Ch 7, Relationship Accelerators, plus the Changemakers pathways</li>
<li><strong>Do:</strong> the DISC assessment and the Career Development Center video before next class</li>
<li><em>Optional, never graded:</em> the <strong>Week 5 setup</strong> at <code>aura-lab.siue.edu/students</code>: LibreOffice, Excalidraw</li>
</ul>
<footer>FST 101 · Belonging at SIUE · Fall 2026</footer>
</section>
