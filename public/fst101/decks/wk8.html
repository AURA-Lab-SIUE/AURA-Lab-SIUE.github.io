</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="FST 101 · Your Next Steps · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--footer:FST 101 · Your Next Steps · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="guerrero-and-rod-2013-journal-of-political-science-education">Guerrero and Rod, 2013, Journal of Political Science Education</h3>
<h1 id="the-cheapest-grade-lever-office-hours">The Cheapest Grade Lever: Office Hours</h1>
<p><strong>406 students, eight courses, four years: more office-hour visits went with higher course grades.</strong></p>
<ul>
<li>Bring the <strong>specific question</strong>, never &quot;I'm confused&quot;</li>
<li>Bring <strong>your attempt</strong>: the draft, the wrong answer, the half-read article</li>
<li>Say <strong>what you already tried</strong></li>
<li>Go once <strong>before anything is wrong</strong>. The second visit is easy</li>
</ul>
<p><strong>Do this: pick one class and go once in the next two weeks.</strong></p>
<footer>FST 101 · Your Next Steps · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="FST 101 · Your Next Steps · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--footer:FST 101 · Your Next Steps · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="gallup-purdue-index-2014">Gallup-Purdue Index, 2014</h3>
<h1 id="letters-are-built-in-year-one">Letters Are Built in Year One</h1>
<p><strong>Graduates with a professor who cared about them, excited them about learning, and encouraged their dreams had more than double the odds of being engaged at work. Only 14 percent had all three.</strong></p>
<ul>
<li>A letter in year three needs a professor who <strong>knew your name</strong> in year one</li>
<li>Two by spring. That takes <strong>office hours, a question after class, showing up</strong></li>
<li>It is a <strong>numbers problem</strong>, not a charm problem</li>
</ul>
<p><strong>Do this: write down two professors. If you cannot name two, that is the task for spring.</strong></p>
<footer>FST 101 · Your Next Steps · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="FST 101 · Your Next Steps · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--footer:FST 101 · Your Next Steps · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="nace-2025-internship-and-co-op-report--siue-career-development-center">NACE, 2025 Internship and Co-op Report · SIUE Career Development Center</h3>
<h1 id="the-career-center-starts-this-year">The Career Center Starts This Year</h1>
<p><strong>Employers offered full-time jobs to 62 percent of their 2024 interns. An internship is a job interview that lasts a summer.</strong></p>
<ul>
<li>SIUE's floor: a <strong>2.0 GPA</strong> and <strong>60 hours</strong> of work in a term. A first-year qualifies</li>
<li><strong>Cougar Jobline</strong> (siue.12twenty.com) lists the postings and books the counselor</li>
<li><strong>Career Development Center, 0281 Student Success Center · 618-650-3708</strong></li>
</ul>
<p><strong>Do this: log in to Cougar Jobline once this semester and book one appointment.</strong></p>
<footer>FST 101 · Your Next Steps · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="FST 101 · Your Next Steps · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--footer:FST 101 · Your Next Steps · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="okano-kaczmarzyk-gabrieli-and-grossman-2019-npj-science-of-learning">Okano, Kaczmarzyk, Gabrieli, and Grossman, 2019, npj Science of Learning</h3>
<h1 id="sleep-is-part-of-the-exam">Sleep Is Part of the Exam</h1>
<p><strong>88 students in a college chemistry class wore activity trackers. Sleep explained nearly 25 percent of the difference in their grades.</strong></p>
<ul>
<li>The night <strong>before</strong> the test: no relation to the score</li>
<li>The <strong>week and the month</strong> before: duration, quality, and consistency all counted</li>
<li>An all-nighter cannot rescue a bad month, and one late night cannot undo a steady one</li>
</ul>
<p><strong>Do this: pick a bedtime for the next 30 days and hold it within an hour, weekends included.</strong></p>
<footer>FST 101 · Your Next Steps · Fall 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="FST 101 · Your Next Steps · Fall 2026" data-theme="orator-dark" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--footer:FST 101 · Your Next Steps · Fall 2026;--theme:orator-dark;" data-marpit-pagination-total="19">
<h3 id="bravata-and-colleagues-2020-journal-of-general-internal-medicine">Bravata and colleagues, 2020, Journal of General Internal Medicine</h3>
<h1 id="feeling-like-a-fraud-is-normal">Feeling Like a Fraud Is Normal</h1>
<p><strong>62 studies, 14,161 people: between 9 and 82 percent reported impostor feelings. Half of those studies were of students.</strong></p>
<ul>
<li>It arrives with a <strong>step up</strong>: a new school, a new level, a first grade back</li>
<li>It is defined on <strong>high achievers</strong>. The feeling is not a measurement</li>
<li>Nobody can see it on anyone else, so everyone thinks they are the only one</li>
</ul>
<p><strong>Do this: when it shows up, name it to one person, then do the next task anyway.</strong></p>
<footer>FST 101 · Your Next Steps · Fall 2026</footer>
</section>

<h3 id="oecd-digital-education-outlook-2026">OECD Digital Education Outlook 2026</h3>
<h1 id="using-ai-without-losing-the-learning">Using AI Without Losing the Learning</h1>
<p><strong>Students who practiced with a generic chatbot scored up to 17 percent worse on the closed-book exam than students who studied alone.</strong></p>
<p><strong>Five questions, every time:</strong></p>
<ol>
<li>Did I <strong>evaluate</strong> the output, or accept it?</li>
<li>Did I compare it against <strong>my own thinking</strong> first?</li>
<li>Do I <strong>own</strong> the answer, or does the tool?</li>
<li>Am I <strong>learning</strong>, or just finishing?</li>
<li>Could I <strong>explain and defend</strong> the reasoning myself?</li>
</ol>
<footer>FST 101 · Your Next Steps · Fall 2026</footer>
