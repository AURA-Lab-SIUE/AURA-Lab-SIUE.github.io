entries:
  # ── From Vibes to Variables — the OER course stack (grouped) ──────────
  - name: "v2v · From Vibes to Variables"
    blurb: "An open textbook (OER) teaching media data science for MC 451 / MC 501. CC BY 4.0."
    href: "https://github.com/AURA-Lab-SIUE/v2v"
    language: "Quarto"
    group: "v2v"
  - name: "v2v-r"
    blurb: "Companion R package: ships a 22M-row Twitch corpus and chapter-by-chapter pedagogical helpers behind a learner-friendly API."
    href: "https://github.com/AURA-Lab-SIUE/v2v-r"
    language: "R"
    group: "v2v"
  - name: "v2v-hub"
    blurb: "Course hub for MC 451 Research Methods (the Liaison Program), the From Vibes to Variables companion site."
    href: "https://github.com/AURA-Lab-SIUE/v2v-hub"
    language: "Web"
    group: "v2v"

  # ── GearOut — its own thing ───────────────────────────────────────────
  - name: "GearOut"
    blurb: "Equipment-reservation platform, deployed at SIUE as MassComm Checkout: students reserve cameras, audio kits, and gear against a shared inventory. The source is not public."
    href: "https://masscomm-checkout.siue.edu/"
    language: "TypeScript"
    group: "gearout"

  # ── Live apps served on the lab site ──────────────────────────────────
  - name: "Career Pathfinder"
    blurb: "Pick a professional track, answer a short survey, and see matched careers with Illinois wage data, the tools each role expects, and the SIUE courses that prepare you for it. Shows the degree requirements for your track and builds a printable plan to bring to advising."
    href: "https://aura-lab.siue.edu/mc-careers-dashboard/"
    language: "SvelteKit"
    group: "apps"
    repo: "https://github.com/AURA-Lab-SIUE/mc-careers-dashboard"
  - name: "Banned-Word Checker"
    blurb: "A quick, in-browser check of a document against a banned-word list. Nothing leaves your machine. For deeper, configurable term discovery, use Concordance."
    href: "https://aura-lab.siue.edu/banned-words/"
    language: "Web"
    group: "apps"
    repo: "https://github.com/AURA-Lab-SIUE/banned-word-checker"
    seeAlso: { label: "Concordance ↗", href: "https://github.com/AURA-Lab-SIUE/concordance" }
  - name: "LitMap"
    blurb: "Narrow a research topic by reading. Log each source against the same eight questions, watch the saturation curve flatten, and let the gap, the question and a feasibility budget fall out of the columns. Runs in the browser; nothing leaves your machine."
    href: "https://aura-lab.siue.edu/litmap/"
    language: "Web"
    group: "apps"
    seeAlso: { label: "MethodoSync \u2197", href: "https://aura-lab.siue.edu/methodosync/" }
  - name: "MethodoSync"
    blurb: "Qualitative to quantitative coding: turn an open-coding pass into a codebook and a coded dataset, in the browser."
    href: "https://aura-lab.siue.edu/methodosync/"
    language: "Web"
    group: "apps"
    seeAlso: { label: "LitMap \u2197", href: "https://aura-lab.siue.edu/litmap/" }
  - name: "Concordance"
    blurb: "Configurable term discovery across a corpus, for when the Banned-Word Checker fixed list is too blunt."
    href: "https://github.com/AURA-Lab-SIUE/concordance"
    language: "Web"
    group: "apps"
