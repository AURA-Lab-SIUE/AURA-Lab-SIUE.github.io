entries:
  - name: "v2v"
    blurb: "From Vibes to Variables — an open textbook (OER) teaching media data science for MC 451 / MC 501. CC BY 4.0."
    href: "https://github.com/AURA-Lab-SIUE/v2v"
    language: "Quarto"
  - name: "v2v-r"
    blurb: "Companion R package for the From Vibes to Variables textbook — ships a 22M-row Twitch corpus and chapter-by-chapter pedagogical helpers behind a learner-friendly API."
    href: "https://github.com/AURA-Lab-SIUE/v2v-r"
    language: "R"
  - name: "v2v-hub"
    blurb: "Course hub for MC 451 Research Methods (the Liaison Program) — the From Vibes to Variables companion site."
    href: "https://github.com/AURA-Lab-SIUE/v2v-hub"
    language: "Web"
  - name: "GearOut"
    blurb: "Equipment-reservation platform deployed at SIUE as MassComm Checkout."
    href: "https://github.com/AURA-Lab-SIUE/equipment-checkout"
    language: "TypeScript"
  - name: "Mass Comm Careers Dashboard"
    blurb: "Interactive dashboard mapping career outcomes and pathways for Mass Communications graduates."
    href: "https://github.com/AURA-Lab-SIUE/mc-careers-dashboard"
    language: "SvelteKit"
  - name: "Concordance"
    blurb: "A topic-agnostic term checker — test documents against any configurable term list. AURA Lab in collaboration with SIM DAD LLC."
