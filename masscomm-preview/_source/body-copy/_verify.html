<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Verify body copy</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<link href="mc-body.css" rel="stylesheet"/>
<style>
  body{ font-family:'Source Sans Pro',sans-serif; max-width:900px; margin:1.5rem auto; padding:0 24px; color:#262626; }
  .note{ background:#111;color:#fff;font-size:13px;padding:8px 12px;text-align:center;margin:-1.5rem -24px 1.5rem; }
  .simh1{ color:#e5182d;font-weight:900;font-size:1.1rem;margin:0 0 .2rem; }
  .simh2{ font-family:'Source Serif 4',Georgia,serif;font-size:2rem;margin:0 0 1.2rem;color:#1a1a1a; }
  .frame{ border:1px dashed #ccc; }
  select{ padding:.4rem; margin-bottom:1rem; }
</style></head>
<body>
<div class="note">VERIFY — local mc-body.css applied; dashed frame = the editable Content field. Above it is template-simulated.</div>
<label>Body file: <select id="pick" onchange="load()">
  <option>home-body-BEST.html</option>
  <option selected>degrees-programs-body-BEST.html</option>
  <option>for-students-body-BEST.html</option>
  <option>alumni-friends-body-BEST.html</option>
  <option>facilities-services-body-BEST.html</option>
</select></label>
<p class="simh1">MASS COMMUNICATIONS</p>
<h2 class="simh2" id="pt">Degrees &amp; Programs</h2>
<div class="frame" id="out">loading…</div>
<script>
function load(){
  var f = document.getElementById('pick').value;
  document.getElementById('pt').textContent = f.replace('-body-BEST.html','').replace(/-/g,' ');
  fetch(f).then(function(r){return r.text();}).then(function(t){
    t = t.replace(/<style>@import[^<]*<\/style>/,''); // local <link> supplies styles
    document.getElementById('out').innerHTML = t;
  });
}
load();
</script>
</body></html>
